name: CI
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r backend/requirements.txt
      - name: Boot test
        run: |
          . .venv/bin/activate
          pytest -q backend/tests/test_boot.py

  smoke:
    if: ${{ github.event.pull_request.head.ref != 'docs' }} # optional gate
    runs-on: ubuntu-latest
    env:
      APR_USE_APRYSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r backend/requirements.txt
      - name: E2E (agent → review → counts)
        run: |
          . .venv/bin/activate
          pytest -q backend/tests/test_mvp_e2e.py -m e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r backend/requirements.txt
          pip install ruff mypy
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check backend/ --fix
      - name: Type check
        run: |
          . .venv/bin/activate
          mypy backend/ --ignore-missing-imports